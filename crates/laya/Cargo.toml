[package]
name = "laya"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
fs2 = "0.4"
regex = "1"
futures = "0.3"
rust-embed = "8"
mime_guess = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
