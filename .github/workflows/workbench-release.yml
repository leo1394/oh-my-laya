name: Workbench release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime and test dependencies
        run: python -m pip install .
      - name: Verify release version
        run: |
          python tools/version.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python tools/version.py --tag "$GITHUB_REF_NAME"
          fi
      - name: Build embedded web assets and release binary
        run: tools/package-workbench-release.sh
      - name: Verify Rust persistence and frontend contracts before packaging
        run: |
          cargo test --locked
          npm --prefix web test
          cargo build --locked
          PYTHONPATH=src python -m unittest discover -s tests
          python -m unittest discover -s skills/alpha-squad-coding-craft/tests
          LAYA_TEST_BINARY="$PWD/dist/workbench/laya-macos-arm64" python tests/smoke_workbench.py
          LAYA_TEST_BINARY="$PWD/dist/workbench/laya-macos-arm64" python tests/smoke_activity.py
      - uses: actions/upload-artifact@v4
        with:
          name: laya-macos-arm64
          path: |
            dist/workbench/laya-macos-arm64
            dist/workbench/laya-macos-arm64.sha256
      - name: Attach checksummed binary to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != true ]; then
            echo "error: refusing to modify published release ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fx laya-macos-arm64 >/dev/null; then
            verification_dir=$(mktemp -d)
            gh release download "${GITHUB_REF_NAME}" --pattern 'laya-macos-arm64*' --dir "$verification_dir"
            (cd "$verification_dir" && shasum -a 256 -c laya-macos-arm64.sha256)
            PYTHONPATH=src python - "$verification_dir/laya-macos-arm64" <<'PY'
          import sys
          from pathlib import Path
          from laya_tell_me.runtime_install import WORKBENCH_VERSION, TRUSTED_RELEASES, _sha256, _validate_binary
          artifact = Path(sys.argv[1])
          assert _sha256(artifact) == TRUSTED_RELEASES[WORKBENCH_VERSION]['sha256']
          _validate_binary(artifact)
          PY
            LAYA_TEST_BINARY="$verification_dir/laya-macos-arm64" python tests/smoke_workbench.py
            LAYA_TEST_BINARY="$verification_dir/laya-macos-arm64" python tests/smoke_activity.py
            exit 0
          fi
          for asset in laya-macos-arm64 laya-macos-arm64.sha256; do
            if gh release view "${GITHUB_REF_NAME}" --json assets \
                --jq ".assets[].name" | grep -Fx "$asset" >/dev/null; then
              echo "error: immutable release asset already exists: $asset" >&2
              exit 1
            fi
          done
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from laya_tell_me.runtime_install import WORKBENCH_VERSION, TRUSTED_RELEASES, _sha256
          assert _sha256(Path('dist/workbench/laya-macos-arm64')) == TRUSTED_RELEASES[WORKBENCH_VERSION]['sha256'], 'Release bytes must match the installer pin before upload'
          PY
          gh release upload "${GITHUB_REF_NAME}" \
            dist/workbench/laya-macos-arm64 \
            dist/workbench/laya-macos-arm64.sha256
